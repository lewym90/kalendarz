<script>try{var s=(JSON.parse(localStorage.getItem("kalendarz.v1")||"{}").settings)||{};var t=s.theme||"auto";var d=t==="auto"?matchMedia("(prefers-color-scheme: dark)").matches:t==="dark";document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.dataset.accent=s.accent||"zorza"}catch(e){}</script>
